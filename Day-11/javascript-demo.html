    <div class="form">
    <h3>Simple Form</h3>

    <input class="input-box" type="text" placeholder="Enter Name" id="textbox1">
    <input class="input-box" type="email" placeholder="Enter Email" id="textbox2">
    <input class="input-box" type="number" placeholder="Enter Age" id="textbox3">

    <select class="input-box1" id="course">
        <option value="" selected>Select Your Course</option>
        <option value="MERN">MERN</option>
        <option value="MEAN">MEAN</option>
    </select>

    <button class="btn" onclick="changeText1();">Submit</button>
</div>

<textarea id="output1" rows="10" cols="50"></textarea>

    <script>
        function changeText() {
            var span = document.getElementById("output");
            var textBox = document.getElementById("textbox");
            span.innerText = textbox.value;
            textbox.style.color = "red";
            }

            function changeText1() {
    var name = document.getElementById("textbox1").value;
    var email = document.getElementById("textbox2").value;
    var age = document.getElementById("textbox3").value;
    var course = document.getElementById("course").value;

    var output = `Name: ${name}\nEmail: ${email}\nAge: ${age}\nCourse: ${course}`;
    
    var outputBox = document.getElementById("output1");
    outputBox.value = output;
    outputBox.style.color = "red";
}
    </script>
