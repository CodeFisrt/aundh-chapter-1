<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="container">
        <h1>Using charCodeAt() method</h1>
        <!-- <input type="text" > -->
         <p id="demo"></p>
    </div>

    <script>
        var text = "hello"
        var text1 = text.charCodeAt(0);

        document.getElementById("demo").innerHTML = text1;
    </script>
</body>
</html>
