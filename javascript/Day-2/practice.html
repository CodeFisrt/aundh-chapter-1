 <!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="pdemo.js"></script>
    <style>
      .container {
            border: 2px solid #000;
            padding: 20px;
            width: 300px;
            margin: 50px auto;
            border-radius: 10px;
            text-align: center;
            font-family: Arial, sans-serif;
        }

        input {
            margin: 10px 0;
            padding: 5px;
            width: 90%;
        }

        button {
            padding: 8px 16px;
            margin-top: 10px;
        }

        h3 {
            margin-top: 20px;
        }
    </style>
 </head>
 <body> 
    <div class="container"> 
    <h2>Addition of Two Numbers</h2>

    <input type="number" id="num11" placeholder="Enter first number">
    <input type="number" id="num22" placeholder="Enter second number">
    <button onclick="addNumbers()">Add</button>

    <h3>Result: <span id="result">0</span></h3>
    </div>
    <div class="container">
        <h2>substract Two numbers</h2>
        <input type=" number" id="num1" placeholder="Enter first number">
        <input type=" number" id="num2" placeholder="Enter second number">
        <button onclick="subNumbers()">Subtract</button>
        <h3>Answer: <span id="substraction">0</span></h3>
    </div>
    <div class="container">
        <h2>Multiplication Two numbers</h2>
        <input type=" number" id="num3" placeholder="Enter first number">
        <input type=" number" id="num4" placeholder="Enter second number">
        <button onclick="mulNumbers()">Multiplication</button>
        <h3>Answer: <span id="Multiplication">0</span></h3>
    </div>
 </body>
 </html>
